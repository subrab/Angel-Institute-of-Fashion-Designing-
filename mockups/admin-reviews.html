<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Reviews — Angel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --ink:#1C120E; --muted:#6E5E58; --muted-2:#8F8079;
    --rani:#C81457; --rani-deep:#93103F;
    --gold:#B8862B; --gold-soft:#E4B95E;
    --glass-border: rgba(28,18,14,0.1); --alt-bg:#FFF6F8; --max:960px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--alt-bg); color:var(--ink); font-family:'Manrope',sans-serif; font-size:16px; line-height:1.5;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  .wrap{max-width:var(--max); margin:0 auto; padding:32px 24px;}

  header{background:var(--ink); color:#fff; padding:18px 0;}
  header .wrap{display:flex; align-items:center; justify-content:space-between; padding-top:0; padding-bottom:0;}
  header h1{font-size:1.1rem; color:#fff;}
  header .sub{font-size:0.78rem; color:#B6A69F;}
  #logoutBtn{background:none; border:1px solid rgba(255,255,255,0.3); color:#fff; padding:8px 16px; border-radius:8px; font-family:'Manrope',sans-serif; font-size:0.85rem; cursor:pointer; display:none;}
  #logoutBtn:hover{background:rgba(255,255,255,0.1);}

  /* login */
  #loginView{max-width:380px; margin:80px auto; background:#fff; border:1px solid var(--glass-border); border-radius:16px; padding:32px; box-shadow:0 18px 44px rgba(28,18,14,0.08);}
  #loginView h2{font-size:1.3rem; margin-bottom:6px;}
  #loginView p{color:var(--muted); font-size:0.9rem; margin-bottom:22px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:0.82rem; font-weight:600; margin-bottom:6px;}
  .field input, .field select{width:100%; padding:11px 14px; border:1px solid var(--glass-border); border-radius:8px; font-family:'Manrope',sans-serif; font-size:0.95rem;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg, var(--rani), var(--rani-deep)); color:#fff; border:none; padding:12px 20px; border-radius:9px; font-family:'Manrope',sans-serif; font-weight:600; font-size:0.92rem; cursor:pointer; width:100%;}
  .btn:hover{opacity:0.92;}
  .btn:disabled{opacity:0.6; cursor:default;}
  .error-msg{background:rgba(200,20,20,0.07); border:1px solid rgba(200,20,20,0.25); color:#8a1f1f; padding:10px 14px; border-radius:8px; font-size:0.85rem; margin-top:14px; display:none;}
  .error-msg.show{display:block;}

  /* dashboard */
  #dashView{display:none;}
  .toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .toolbar h2{font-size:1.4rem;}
  .filters{display:flex; gap:8px;}
  .filters button{background:#fff; border:1px solid var(--glass-border); padding:8px 14px; border-radius:20px; font-family:'Manrope',sans-serif; font-size:0.82rem; cursor:pointer; color:var(--muted);}
  .filters button.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .review-item{background:#fff; border:1px solid var(--glass-border); border-radius:14px; padding:22px; margin-bottom:14px;}
  .review-item .top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:10px;}
  .review-item .name{font-family:'Fraunces',serif; font-size:1.05rem;}
  .review-item .stars{color:var(--gold); letter-spacing:2px; font-size:0.95rem; margin-top:2px;}
  .badge{font-size:0.72rem; font-weight:700; padding:4px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap;}
  .badge.pending{background:#FFF3D6; color:#8a6300;}
  .badge.approved{background:#E1F5E4; color:#1e6b2c;}
  .badge.rejected{background:#FBE1E1; color:#8a1f1f;}
  .review-item .quote{color:var(--ink); font-size:0.95rem; margin:8px 0 12px; line-height:1.5;}
  .review-item .meta{font-size:0.8rem; color:var(--muted-2); margin-bottom:14px;}
  .review-item .meta span{margin-right:16px;}
  .actions{display:flex; gap:10px;}
  .actions button{font-family:'Manrope',sans-serif; font-size:0.85rem; font-weight:600; padding:8px 16px; border-radius:8px; cursor:pointer; border:1px solid transparent;}
  .btn-approve{background:#1e6b2c; color:#fff;}
  .btn-reject{background:#fff; color:#8a1f1f; border-color:#8a1f1f;}
  .btn-pending{background:#fff; color:var(--muted); border-color:var(--glass-border);}
  .actions button:disabled{opacity:0.5; cursor:default;}
  .actions button.current{outline:2px solid var(--ink); outline-offset:2px;}

  .empty{text-align:center; padding:60px 20px; color:var(--muted-2);}
  .loading{text-align:center; padding:60px 20px; color:var(--muted-2);}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <h1>Angel — Admin</h1>
      <div class="sub">Review moderation</div>
    </div>
    <button id="logoutBtn">Log out</button>
  </div>
</header>

<div id="loginView">
  <h2>Admin login</h2>
  <p>Sign in to review, approve, or reject submitted reviews.</p>
  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" required>
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" required>
    </div>
    <button type="submit" class="btn" id="loginBtn">Log in</button>
    <div class="error-msg" id="loginError"></div>
  </form>
</div>

<div id="dashView">
  <div class="wrap">
    <div class="toolbar">
      <h2>Reviews</h2>
      <div class="filters" id="filters">
        <button data-filter="pending" class="active">Pending</button>
        <button data-filter="approved">Approved</button>
        <button data-filter="rejected">Rejected</button>
        <button data-filter="all">All</button>
      </div>
    </div>
    <div id="reviewList"><div class="loading">Loading reviews…</div></div>
  </div>
</div>

<script>
  var API_BASE = 'https://angel-institute-of-fashion-designing.onrender.com';
  var token = null;
  var allReviews = [];
  var currentFilter = 'pending';

  var loginView = document.getElementById('loginView');
  var dashView = document.getElementById('dashView');
  var logoutBtn = document.getElementById('logoutBtn');

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    var errEl = document.getElementById('loginError');
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    fetch(API_BASE + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('loginEmail').value.trim(),
        password: document.getElementById('loginPassword').value
      })
    })
      .then(function (res) {
        if (!res.ok) return res.json().then(function (d) { throw new Error(d.error || 'Login failed.'); });
        return res.json();
      })
      .then(function (data) {
        token = data.token;
        loginView.style.display = 'none';
        dashView.style.display = 'block';
        logoutBtn.style.display = 'inline-flex';
        loadReviews();
      })
      .catch(function (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = 'Log in';
      });
  });

  logoutBtn.addEventListener('click', function () {
    token = null;
    allReviews = [];
    dashView.style.display = 'none';
    loginView.style.display = 'block';
    logoutBtn.style.display = 'none';
  });

  function loadReviews() {
    var listEl = document.getElementById('reviewList');
    listEl.innerHTML = '<div class="loading">Loading reviews…</div>';
    fetch(API_BASE + '/api/reviews/all', {
      headers: { Authorization: 'Bearer ' + token }
    })
      .then(function (res) {
        if (!res.ok) throw new Error('Could not load reviews (' + res.status + ').');
        return res.json();
      })
      .then(function (data) {
        allReviews = data;
        renderReviews();
      })
      .catch(function (err) {
        listEl.innerHTML = '<div class="empty">' + err.message + '</div>';
      });
  }

  function renderReviews() {
    var listEl = document.getElementById('reviewList');
    var filtered = currentFilter === 'all' ? allReviews : allReviews.filter(function (r) { return r.status === currentFilter; });

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="empty">No ' + (currentFilter === 'all' ? '' : currentFilter + ' ') + 'reviews.</div>';
      return;
    }

    listEl.innerHTML = filtered.map(function (r) {
      var stars = '★★★★★'.slice(0, r.rating) + '☆☆☆☆☆'.slice(0, 5 - r.rating);
      var date = new Date(r.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      return '' +
        '<div class="review-item">' +
          '<div class="top">' +
            '<div>' +
              '<div class="name">' + escapeHtml(r.author_name) + '</div>' +
              '<div class="stars">' + stars + '</div>' +
            '</div>' +
            '<span class="badge ' + r.status + '">' + r.status + '</span>' +
          '</div>' +
          (r.comment ? '<p class="quote">' + escapeHtml(r.comment) + '</p>' : '<p class="quote" style="color:var(--muted-2); font-style:italic;">No comment left.</p>') +
          '<div class="meta">' +
            '<span>📞 ' + escapeHtml(r.phone || '—') + '</span>' +
            '<span>✉️ ' + escapeHtml(r.email || '—') + '</span>' +
            '<span>' + date + '</span>' +
          '</div>' +
          '<div class="actions">' +
            '<button class="btn-approve' + (r.status === 'approved' ? ' current' : '') + '" onclick="setStatus(\'' + r.id + '\',\'approved\')">Approve</button>' +
            '<button class="btn-reject' + (r.status === 'rejected' ? ' current' : '') + '" onclick="setStatus(\'' + r.id + '\',\'rejected\')">Reject</button>' +
            '<button class="btn-pending' + (r.status === 'pending' ? ' current' : '') + '" onclick="setStatus(\'' + r.id + '\',\'pending\')">Mark pending</button>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  function setStatus(id, status) {
    fetch(API_BASE + '/api/reviews/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ status: status })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('Could not update that review.');
        return res.json();
      })
      .then(function () {
        loadReviews();
      })
      .catch(function (err) {
        alert(err.message);
      });
  }

  document.getElementById('filters').addEventListener('click', function (e) {
    if (e.target.tagName !== 'BUTTON') return;
    document.querySelectorAll('#filters button').forEach(function (b) { b.classList.remove('active'); });
    e.target.classList.add('active');
    currentFilter = e.target.getAttribute('data-filter');
    renderReviews();
  });

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }
</script>

</body>
</html>
